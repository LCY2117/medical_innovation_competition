# ==============================================
# LifeReflex Android 应用程序配置
# ==============================================

# ----------------------------------------------
# 后端服务地址配置（部署后修改以下两项）
# ----------------------------------------------

# REST API 基础地址（必须以 / 结尾）
LRA_API_BASE=https://lifereflex.mddcommunity.top/

# WebSocket 端点（用于事件流推送）
LRA_WS_BASE=wss://lifereflex.mddcommunity.top/ws

# The current workspace path contains Chinese characters; Android Gradle Plugin blocks
# Windows builds unless this path check is explicitly disabled.
android.overridePathCheck=true

# Compose plus AndroidX Security can exceed the Gradle default heap on Windows.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
