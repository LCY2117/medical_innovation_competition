# 生命反射弧（Life Reflex Arc）应急协同系统 · 一键部署
# 用法：
#   docker compose up -d --build     # 构建并后台启动
#   docker compose up --build        # 构建并前台启动（看日志）
#   docker compose down              # 停止
#   WEB_PORT=80 docker compose up -d # 自定义宿主端口（默认 8080）
services:
  backend:
    build:
      context: ./backend
    image: lifereflex-backend:latest
    container_name: lifereflex-backend
    # 端口 8000 仅容器内使用（Nginx 反代访问），不映射到宿主
    expose:
      - "8000"
    environment:
      DATABASE_URL: sqlite:////app/data/lifereflex.db
      SEED_ON_STARTUP: "true"
      # 密钥：生产环境务必覆盖为强随机值
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    volumes:
      # SQLite 数据持久化到宿主 ./data
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ./web
    image: lifereflex-web:latest
    container_name: lifereflex-web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 宿主端口可配置：默认 8080（WEB_PORT=80 则映射到 80）
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
