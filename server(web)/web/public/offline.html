<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#071014" />
    <title>生命反射弧移动端离线</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0d1517;
        color: #f2f7f7;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 28% 18%, rgba(42, 211, 155, 0.14), transparent 28%),
          #0d1517;
      }

      main {
        width: min(100%, 420px);
        border: 1px solid #2b3d41;
        border-radius: 8px;
        background: #142022;
        padding: 22px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.26);
      }

      h1 {
        margin: 0;
        font-size: 1.35rem;
        letter-spacing: 0;
      }

      p {
        margin: 12px 0 0;
        color: #a6b5b8;
        line-height: 1.7;
      }

      button {
        width: 100%;
        min-height: 44px;
        margin-top: 18px;
        border: 0;
        border-radius: 8px;
        background: #d7f0ef;
        color: #0c1719;
        font: inherit;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>移动端暂时离线</h1>
      <p>当前无法连接生命反射弧云端服务。请恢复网络后刷新页面，已打开的事件链接不会失效。</p>
      <button type="button" onclick="window.location.reload()">重新连接</button>
    </main>
  </body>
</html>
